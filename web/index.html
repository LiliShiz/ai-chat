<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + safe-area в CSS: на iPhone лента не заезжает под home-индикатор -->
    <!-- interactive-widget=resizes-content: экранная клавиатура сжимает
         саму раскладку, а не накрывает её. Без этого футер с полем
         ввода остаётся под клавиатурой, а 100dvh считается по высоте
         БЕЗ неё — то есть по области, которой на экране уже нет. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Веб-чат с языковой моделью через OpenRouter" />
    <!-- Инлайновая иконка: одним запросом меньше и никакого 404 в консоли -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fed'/%3E%3Cpath d='M8 11h16M8 16h16M8 21h10' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Чат с моделью</title>
  </head>
  <body>
    <!-- Тема применяется до первой отрисовки. Без этого при выбранной
         тёмной теме страница успевает моргнуть светлой: React стартует
         уже после того, как браузер нарисовал первый кадр. -->
    <script>
      try {
        var t = localStorage.getItem('ai-chat:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
