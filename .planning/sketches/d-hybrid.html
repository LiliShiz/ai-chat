<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>D — Гибрид A+B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── D. ГИБРИД: ответ — редакция, обвязка — терминал ─────────────
   Текст модели набран антиквой по мере 66 знаков: его читают.
   Всё служебное — шапка, метки, кнопки, код, подсказки —
   моноширинное и тихое: это приборы, а не текст.
   Разделение шрифтом делает иерархию очевидной без единой рамки.
   ──────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
body{margin:0}

.pane{
  --bg:#f6f4ee; --fg:#191713; --dim:#847c6d; --line:#e0dacb;
  --accent:#9a4a1b; --accent-fg:#fdfaf4; --code:#eae5d8; --user:#ebe5d6;
  background:var(--bg); color:var(--fg);
  font-family:Literata,Georgia,serif;
}
.pane--dark{
  --bg:#100f0d; --fg:#e4e0d6; --dim:#7f7a6c; --line:#242219;
  --accent:#e0913f; --accent-fg:#14120d; --code:#191712; --user:#1e1c15;
}

.app{display:grid;grid-template-rows:auto 1fr auto;height:760px;
     border-inline:1px solid var(--line)}

/* ── шапка: строка приборов ── */
.hdr{display:flex;align-items:center;gap:14px;padding:12px 24px;
     border-bottom:1px solid var(--line);
     font-family:'JetBrains Mono',monospace}
.hdr__brand{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.hdr__brand::before{content:'▌';color:var(--accent);margin-right:8px}
.hdr__meta{flex:1;font-size:11px;color:var(--dim);letter-spacing:.02em}
.hdr__meta::before{content:'◇ ';color:var(--accent);opacity:.7}

.feed{margin:0;padding:32px 24px;list-style:none;overflow:auto;
      display:flex;flex-direction:column;gap:32px}

.msg{display:flex;flex-direction:column;gap:9px;max-width:66ch}
.msg__who{font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.17em;text-transform:uppercase;color:var(--dim)}
.msg__who em{font-style:normal;opacity:.5;letter-spacing:.04em;text-transform:none}

/* ── реплика человека: плашка без скруглений, тихая ── */
.msg--user{align-self:flex-end;align-items:flex-end;max-width:50ch}
.msg--user .msg__body{background:var(--user);padding:11px 16px;
  border-right:2px solid var(--accent);font-size:15.5px;line-height:1.55}
.msg--user .msg__who::after{content:' ▸';color:var(--accent)}

/* ── ответ модели: материал для чтения ── */
.msg--bot .msg__who::before{content:'▹ ';color:var(--accent)}
.msg--bot .msg__body{font-size:17px;line-height:1.68}
.msg__body>:first-child{margin-top:0}
.msg__body>:last-child{margin-bottom:0}

/* подзаголовки — приборные, с терминальным префиксом */
.msg__body h3{font-family:'JetBrains Mono',monospace;font-size:10.5px;
  letter-spacing:.17em;text-transform:uppercase;color:var(--accent);
  font-weight:500;margin:28px 0 11px}
.msg__body h3::before{content:'── '}

.msg__body ol{padding-left:1.45em;margin:0 0 18px}
.msg__body li{margin-bottom:10px}
.msg__body li::marker{font-family:'JetBrains Mono',monospace;font-size:.8em;
  color:var(--accent)}
.msg__body code{font-family:'JetBrains Mono',monospace;font-size:.84em;
  background:var(--code);padding:1px 5px}
.msg__body pre{font-family:'JetBrains Mono',monospace;background:var(--code);
  border-left:2px solid var(--accent);padding:15px 18px;overflow:auto;
  font-size:13px;line-height:1.65;margin:20px 0}
.msg__body pre code{background:none;padding:0;font-size:1em}
.k{color:var(--accent)}

/* ── действия: терминальные скобки, проявляются по ховеру ── */
.msg__tools{display:flex;gap:10px;margin-top:20px}
.tool{background:none;border:0;padding:0;cursor:pointer;color:var(--dim);
  font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase}
.tool::before{content:'[';opacity:.45;margin-right:3px}
.tool::after{content:']';opacity:.45;margin-left:3px}
.tool:hover{color:var(--accent)}

.caret{display:inline-block;width:.55em;height:1.05em;background:var(--accent);
  vertical-align:-2px;margin-left:4px;animation:b 1.05s steps(2) infinite}
@keyframes b{50%{opacity:0}}

/* ── ввод: серифный текст на терминальной рамке ── */
.ftr{border-top:1px solid var(--line);padding:16px 24px}
.composer{display:flex;gap:12px;align-items:stretch;max-width:66ch}
.composer__input{flex:1;border:1px solid var(--line);background:var(--code);
  padding:11px 14px;color:var(--dim);font-size:16px;font-family:inherit;
  display:flex;align-items:center}
.composer__input::before{content:'$';font-family:'JetBrains Mono',monospace;
  color:var(--accent);margin-right:9px;font-size:13px}
.btn{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:500;
  padding:11px 22px;cursor:pointer;border:1px solid var(--accent);
  background:var(--accent);color:var(--accent-fg);
  letter-spacing:.11em;text-transform:uppercase}
.btn--ghost{background:none;color:var(--dim);border-color:var(--line);
  padding:5px 12px;font-size:10px;letter-spacing:.09em}
.hint{margin:13px 0 0;font-family:'JetBrains Mono',monospace;font-size:10px;
  color:var(--dim);letter-spacing:.05em}
kbd{font-family:inherit;border:1px solid var(--line);padding:1px 5px;font-size:9.5px}

.wrap{display:grid;grid-template-columns:1fr 1fr}
.col{position:relative}
.tag{position:absolute;top:0;left:0;background:var(--accent);color:var(--accent-fg);
  font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 9px;
  letter-spacing:.1em;z-index:2}
</style>
</head>
<body>
<div class="wrap">
  <div class="col pane"><span class="tag">D · ГИБРИД · СВЕТЛАЯ</span><div class="app" id="l"></div></div>
  <div class="col pane pane--dark"><span class="tag">D · ГИБРИД · ТЁМНАЯ</span><div class="app" id="d"></div></div>
</div>
<script src="_content.js"></script>
<script>l.innerHTML=CHAT;d.innerHTML=CHAT;</script>
</body>
</html>
