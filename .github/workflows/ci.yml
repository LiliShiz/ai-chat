name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci, а не install: ставит ровно то, что в lock-файле,
      # иначе «на моей машине работает» рано или поздно случится.
      - run: npm ci

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Дымовой прогон прод-режима. Добавлен после того, как
      # выяснилось, что `npm start` не выставлял NODE_ENV и отдавал
      # 404 на всё, кроме /api — сборка это не ловила, потому что
      # собиралось-то всё успешно.
      - name: Smoke — прод-режим отдаёт фронт и /api/health
        run: |
          set -euo pipefail
          OPENROUTER_API_KEY=ci-smoke-not-a-real-key npm start &
          # PID, а не `kill %1`: управление задачами в неинтерактивном
          # bash работает не везде, и его падение покрасило бы шаг
          # ложно — уже после того, как проверки прошли.
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            curl -sf http://localhost:8787/api/health >/dev/null && break
            sleep 1
          done

          curl -sf http://localhost:8787/api/health | grep -q '"ok":true'
          curl -sf http://localhost:8787/ | grep -qi '<div id="root">'
          # Проверяем и саму суть: прокси жив и валидирует запрос.
          # Без ключа апстрима в CI дальше валидации не уйти, но ровно
          # эта ветка и ловит «сервер поднялся, а /api/chat отвалился».
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:8787/api/chat \
            -H 'Content-Type: application/json' -d '{"messages":[]}')" = "400"
